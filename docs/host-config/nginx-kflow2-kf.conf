server {
		#access_log /var/log/nginx/kf_access.log;
		#error_log /var/log/nginx/kf_error.log;

		#listen 80;
		#server_name kflow2.cgu.edu.tw;
		#ssl_certificate /etc/letsencrypt/live/kflow2.cgu.edu.tw/fullchain.pem;
		#ssl_certificate_key /etc/letsencrypt/live/kflow2.cgu.edu.tw/privkey.pem;
		# 2026-11-26 mark: uploads/downloads and quiet connections were cut off
		# (60s nginx default timeouts, 512M body limit; raised to 5G per Mark). Record: /home/mark/idle-timeout-fix-20261126.md
		client_max_body_size 5G;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;

	        gzip on;

		location / {
		proxy_pass http://10.100.4.40:12345;
		proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}
		location /data {
		        root    /var/www/html;
		        autoindex on;
		        try_files $uri $uri/ =404;
		}
		location ^~ /.well-known/acme-challenge/ {
		      default_type    "text/plain";
		      root    /var/www/letsencrypt;
		}
}
#log_format proxy_simple '$time_local $remote_addr -> $upstream_addr';
log_format proxy_simple '$time_local $remote_addr "$request_uri" -> $upstream_addr';
server {
		access_log /var/log/nginx/kf_access.log;
		error_log /var/log/nginx/kf_error.log;

                listen 443 ssl;
                server_name kflow2.cgu.edu.tw;
		ssl_certificate /etc/letsencrypt/live/kflow2.cgu.edu.tw/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/kflow2.cgu.edu.tw/privkey.pem;
		# 2026-11-26 mark: uploads/downloads and quiet connections were cut off
		# (60s nginx default timeouts, 512M body limit; raised to 5G per Mark). Record: /home/mark/idle-timeout-fix-20261126.md
		client_max_body_size 5G;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		
		gzip on;
		error_page 404 502 /error.html;

		location /error.html {
		        root    /var/www/html;
		}
		location / {
			proxy_pass http://10.100.4.40:12345;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			access_log /var/log/nginx/proxy.log proxy_simple;
		}
               location ~ /websockify {
                        proxy_pass http://10.100.4.40:12345;
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection "upgrade";
                }

		
}
